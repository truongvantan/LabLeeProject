<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<head th:replace="~{fragments :: page_head('Edit lab member profile', 'tag')}" />
<link
	rel="stylesheet"
	th:href="@{/richtext/richtext.min.css}"
/>
<script
	type="text/javascript"
	th:src="@{/richtext/jquery.richtext.min.js}"
></script>
<script
	src="https://cdn.tiny.cloud/1/23v8b65dspuhtpforj308ya1cib61htuo5l3sd5j8f328t4y/tinymce/6/tinymce.min.js"
	referrerpolicy="origin"
></script>
<meta
	name="_csrf"
	th:content="${_csrf.token}"
/>
<meta
	name="_csrf_header"
	th:content="${_csrf.headerName}"
/>
</head>
<body>
	<div class="container-fluid">
		<div th:replace="~{navigation::menu}"></div>
		<h1 class="text-center mt-5">Edit lab member profile</h1>
		<div th:replace="~{fragments::alert_message_box}"></div>
		<form
			th:action="@{/members/edit}"
			th:object="${memberLabProfileFormEditDTO}"
			method="POST"
			style="max-width: 1250px; margin: 0 auto"
			enctype="multipart/form-data"
		>
			<input
				type="hidden"
				th:field="*{user.id}"
			/>
			<div class="border border-secondary rounded p-3">
				<!-- Nav tabs -->
				<ul
					class="nav nav-tabs"
					id="myTab"
					role="tablist"
				>
					<li
						class="nav-item"
						role="presentation"
					>
						<button
							class="nav-link fw-bold active"
							data-bs-toggle="tab"
							data-bs-target="#overview"
							type="button"
							role="tab"
						>Common Information</button>
					</li>
					<li
						class="nav-item"
						role="presentation"
					>
						<button
							class="nav-link fw-bold"
							data-bs-toggle="tab"
							data-bs-target="#bio"
							type="button"
							role="tab"
						>Biography</button>
					</li>
				</ul>

				<!-- Tab panes -->
				<div class="tab-content">
					<div
						class="tab-pane p-3 active"
						id="overview"
						role="tabpanel"
					>
						<div th:replace="~{members_lab/member_overview_edit :: content}"></div>
					</div>
					<div
						class="tab-pane"
						id="bio"
						role="tabpanel"
					>
						<div th:replace="~{members_lab/member_bio_edit :: content}"></div>
					</div>
				</div>
				<!-- END Tab panes -->

				<div class="text-center">
					<input
						type="submit"
						value="Save"
						class="btn btn-primary m-3"
					/>
					<input
						type="button"
						value="Cancel"
						class="btn btn-secondary"
						id="buttonCancel"
					/>
				</div>
			</div>
		</form>
		<div th:replace="~{fragments::footer}"></div>
	</div>
	
	<script type="text/javascript" th:src="@{/js/common_upload_tinymce.js}"></script>
	<script type="text/javascript">
		const moduleURL = "[[@{/members}]]";
		const urlUploadImage = "[[@{/api/upload/member-bio-image}]]";
		
		$(document).ready(function() {
			uploadImageTinyMCE(urlUploadImage);
		});
	</script>
	<script
		type="text/javascript"
		th:src="@{/js/common_form.js}"
	></script>
</body>
</html>
