<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<head th:replace="~{fragments :: page_head('Edit project', 'tag')}" />
<!-- Styles -->
<link
	rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
/>
<link
	rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"
/>
<link
	rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css"
/>
<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.0/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script
	src="https://cdn.tiny.cloud/1/23v8b65dspuhtpforj308ya1cib61htuo5l3sd5j8f328t4y/tinymce/6/tinymce.min.js"
	referrerpolicy="origin"
></script>
<meta
	name="_csrf"
	th:content="${_csrf.token}"
/>
<meta
	name="_csrf_header"
	th:content="${_csrf.headerName}"
/>
</head>
<body>
	<div class="container-fluid">
		<div th:replace="~{navigation::menu}"></div>
		<h1 class="text-center mt-5">Edit project ID ([[${projectFormEditDTO.id}]])</h1>
		<div th:replace="~{fragments::alert_message_box}"></div>
		<form
			th:action="@{/projects/edit}"
			th:object="${projectFormEditDTO}"
			method="POST"
			style="max-width: 1250px; margin: 0 auto"
			enctype="multipart/form-data"
		>
			<input
				type="hidden"
				th:field="*{id}"
			/>
			<div class="border border-secondary rounded p-3">
				<!-- Nav tabs -->
				<ul
					class="nav nav-tabs"
					id="myTab"
					role="tablist"
				>
					<li
						class="nav-item"
						role="presentation"
					>
						<button
							class="nav-link fw-bold active"
							data-bs-toggle="tab"
							data-bs-target="#overview"
							type="button"
							role="tab"
						>General Information</button>
					</li>
					<li
						class="nav-item"
						role="presentation"
					>
						<button
							class="nav-link fw-bold"
							data-bs-toggle="tab"
							data-bs-target="#abstract"
							type="button"
							role="tab"
						>Abstract</button>
					</li>
					<li
						class="nav-item"
						role="presentation"
					>
						<button
							class="nav-link fw-bold"
							data-bs-toggle="tab"
							data-bs-target="#mainContent"
							type="button"
							role="tab"
						>Main Content</button>
					</li>
				</ul>

				<!-- Tab panes -->
				<div class="tab-content">
					<div
						class="tab-pane p-3 active"
						id="overview"
						role="tabpanel"
					>
						<div th:replace="~{project/project_overview_edit :: content}"></div>
					</div>
					<div
						class="tab-pane"
						id="abstract"
						role="tabpanel"
					>
						<div th:replace="~{project/project_abstract_edit :: content}"></div>
					</div>
					<div
						class="tab-pane p-3"
						id="mainContent"
						role="tabpanel"
					>
						<div th:replace="~{project/project_content_edit :: content}"></div>
					</div>
				</div>
				<!-- END Tab panes -->

				<div class="text-center">
					<input
						type="submit"
						value="Save"
						class="btn btn-primary m-3"
					/>
					<input
						type="button"
						value="Cancel"
						class="btn btn-secondary"
						id="buttonCancel"
					/>
				</div>
			</div>
		</form>
		<div th:replace="~{fragments::footer}"></div>
	</div>
	
	<script type="text/javascript" th:src="@{/js/common_upload_tinymce.js}"></script>
	<script type="text/javascript">
		const moduleURL = "[[@{/projects}]]";
		const urlUploadImage = "[[@{/api/upload/project-image}]]";
		
		$(document).ready(function() {
			uploadImageTinyMCE(urlUploadImage);
		});
	</script>
	<script
		type="text/javascript"
		th:src="@{/js/common_form.js}"
	></script>
</body>
</html>
