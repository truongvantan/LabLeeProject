<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<head th:replace="~{fragments :: page_head('Setting', 'tag')}" />
<script
	src="https://cdn.tiny.cloud/1/23v8b65dspuhtpforj308ya1cib61htuo5l3sd5j8f328t4y/tinymce/6/tinymce.min.js"
	referrerpolicy="origin"
></script>
<meta
	name="_csrf"
	th:content="${_csrf.token}"
/>
<meta
	name="_csrf_header"
	th:content="${_csrf.headerName}"
/>
</head>
<body>
	<div class="container-fluid">
		<div th:replace="~{navigation::menu}"></div>
		<h1 class="text-center mt-5">General information of website</h1>
		<div class="border border-secondary rounded p-3">
		<div th:replace="~{fragments::alert_message_box}"></div>
			<!-- Nav tabs -->
			<ul
				class="nav nav-tabs"
				id="myTab"
				role="tablist"
			>
				<li
					class="nav-item"
					role="presentation"
				>
					<button
						class="nav-link fw-bold active"
						data-bs-toggle="tab"
						data-bs-target="#general"
						type="button"
						role="tab"
					>General Information</button>
				</li>
				<li
					class="nav-item"
					role="presentation"
				>
					<button
						class="nav-link fw-bold"
						data-bs-toggle="tab"
						data-bs-target="#about_us"
						type="button"
						role="tab"
					>About us</button>
				</li>
			</ul>

			<!-- Tab panes -->
			<div class="tab-content">
				<div
					class="tab-pane p-3 active"
					id="general"
					role="tabpanel"
				>
					<div th:replace="~{settings/setting_general :: content}"></div>
				</div>
				<div
					class="tab-pane p-3"
					id="about_us"
					role="tabpanel"
				>
					<div th:replace="~{settings/setting_about_us :: content}"></div>
				</div>
			</div>
			<!-- END Tab panes -->
		</div>
		<div th:replace="~{fragments::footer}"></div>
	</div>
	
	<script type="text/javascript" th:src="@{/js/common_upload_tinymce.js}"></script>
	<script type="text/javascript">
		const moduleURL = "[[@{/}]]";
		const urlUploadImage = "[[@{/api/upload/about-us-image}]]";
		
		$(document).ready(function() {
			uploadImageTinyMCE(urlUploadImage);
		});
	</script>
	<script
		type="text/javascript"
		th:src="@{/js/common_form.js}"
	></script>
</body>
</html>
